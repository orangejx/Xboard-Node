name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - run: make test

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-26.04
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache: true
      - name: Build binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: make build-target TARGET_GOOS=${{ matrix.goos }} TARGET_GOARCH=${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}*
            xbctl-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-docker-amd64:
    name: Build Linux amd64 image
    runs-on: ubuntu-26.04
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: DOCKERHUB_USERNAME
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/xboard-node
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xboard-node
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-linux-amd64
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}:{1}-linux-amd64', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}

  build-docker-arm64:
    name: Build Linux arm64 image
    runs-on: ubuntu-26.04-arm
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: DOCKERHUB_USERNAME
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/xboard-node
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xboard-node
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-linux-arm64
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}:{1}-linux-arm64', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}

  publish-docker-manifest:
    name: Publish Linux multi-arch image
    runs-on: ubuntu-26.04
    needs: [build-docker-amd64, build-docker-arm64]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    environment: DOCKERHUB_USERNAME
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/xboard-node
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xboard-node
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Resolve image tags
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          publish_latest=false
          if [ "${REF_TYPE}" = "tag" ]; then
            highest="$(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
                | sed 's#^refs/tags/##' \
                | sort -V \
                | tail -n 1
            )"
            echo "Highest v tag: ${highest:-<none>}"
            if [ -n "${highest}" ] && [ "${REF_NAME}" = "${highest}" ]; then
              publish_latest=true
            fi
          fi
          echo "publish_latest=${publish_latest}" >> "$GITHUB_OUTPUT"
      - name: Publish GHCR manifest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--tag "${GHCR_IMAGE}:${REF_NAME}")
          if [ "${{ steps.tags.outputs.publish_latest }}" = "true" ]; then
            args+=(--tag "${GHCR_IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${args[@]}" \
            "${GHCR_IMAGE}:${REF_NAME}-linux-amd64" \
            "${GHCR_IMAGE}:${REF_NAME}-linux-arm64"
      - name: Publish Docker Hub manifest
        if: vars.DOCKERHUB_USERNAME != ''
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--tag "${DOCKERHUB_IMAGE}:${REF_NAME}")
          if [ "${{ steps.tags.outputs.publish_latest }}" = "true" ]; then
            args+=(--tag "${DOCKERHUB_IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${args[@]}" \
            "${DOCKERHUB_IMAGE}:${REF_NAME}-linux-amd64" \
            "${DOCKERHUB_IMAGE}:${REF_NAME}-linux-arm64"

  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
