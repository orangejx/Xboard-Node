name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
      - run: make test

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
          cache: true
      - name: Build binaries
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: make build-target TARGET_GOOS=${{ matrix.goos }} TARGET_GOARCH=${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            xboard-node-${{ matrix.goos }}-${{ matrix.goarch }}*
            xbctl-${{ matrix.goos }}-${{ matrix.goarch }}*

  build-docker-amd64:
    name: Build Linux amd64 image
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    environment: DOCKERHUB_USERNAME
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/xboard-node
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xboard-node
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-linux-amd64
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}:{1}-linux-amd64', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}

  build-docker-arm64:
    name: Build Linux arm64 image
    runs-on: ubuntu-24.04-arm
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    environment: DOCKERHUB_USERNAME
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/xboard-node
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xboard-node
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-linux-arm64
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}:{1}-linux-arm64', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}

  publish-docker-manifest:
    name: Publish Linux multi-arch image
    runs-on: ubuntu-latest
    needs: [build-docker-amd64, build-docker-arm64]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    environment: DOCKERHUB_USERNAME
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/xboard-node
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/xboard-node
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish GHCR manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.GHCR_IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.GHCR_IMAGE }}:latest \
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-linux-amd64 \
            ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-linux-arm64
      - name: Publish Docker Hub manifest
        if: vars.DOCKERHUB_USERNAME != ''
        run: |
          docker buildx imagetools create \
            --tag ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.DOCKERHUB_IMAGE }}:latest \
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}-linux-amd64 \
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.ref_name }}-linux-arm64

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/dev'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
