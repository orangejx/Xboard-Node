services:
  app:
    image: ${IMAGE:-orangejx/xboard-node}:${TAG:-latest}
    environment:
      - TZ=Europe/London
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    volumes:
      - ./config.yml:/etc/xboard-node/config.yml:ro
    network_mode: host
    # networks:
    #   - app 
    hostname: xboard-node
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 64m

networks:
  app:
    driver: bridge
